<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 250" width="220" height="250" fill="none" stroke="#0A0A0A" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Tripod Legs (Behind mount) -->
  <!-- Center/Back Leg -->
  <line x1="108" y1="126" x2="108" y2="242" stroke-width="3" />
  <line x1="105" y1="236" x2="111" y2="236" stroke-width="2" />
  <polygon points="108,242 105,248 111,248" fill="#0A0A0A" />

  <!-- Left Leg -->
  <line x1="106" y1="126" x2="36" y2="240" stroke-width="3.5" />
  <line x1="32" y1="234" x2="40" y2="238" stroke-width="2" />
  <polygon points="36,240 30,246 38,246" fill="#0A0A0A" />

  <!-- Right Leg -->
  <line x1="110" y1="126" x2="178" y2="240" stroke-width="3.5" />
  <line x1="174" y1="238" x2="182" y2="234" stroke-width="2" />
  <polygon points="178,240 176,246 184,246" fill="#0A0A0A" />

  <!-- Tripod Leg Spreader & Chains -->
  <line x1="62" y1="196" x2="108" y2="198" stroke-width="1.8" />
  <line x1="108" y1="198" x2="152" y2="196" stroke-width="1.8" />
  <circle cx="108" cy="198" r="3.5" fill="#0A0A0A" />

  <!-- Tripod Leg Wood Hatching Details -->
  <line x1="72" y1="168" x2="68" y2="180" stroke-width="1.2" />
  <line x1="142" y1="168" x2="146" y2="180" stroke-width="1.2" />

  <!-- Equatorial Mount & Alt-Azimuth Head -->
  <rect x="98" y="118" width="20" height="12" rx="2" fill="#0A0A0A" stroke-width="2" />
  <circle cx="108" cy="112" r="10" fill="#FFFFFF" stroke-width="2.5" />
  <circle cx="108" cy="112" r="4" fill="#0A0A0A" stroke-width="1.5" />
  <!-- Altitude Adjustment Knob -->
  <line x1="118" y1="112" x2="128" y2="112" stroke-width="2.5" />
  <circle cx="130" cy="112" r="3" fill="#EDEDED" stroke-width="2" />

  <!-- Telescope Tube Assembly (Angled at ~32 degrees toward top right) -->
  <g transform="rotate(-34 108 108)">
    <!-- Main Refractor Barrel -->
    <!-- Large Front Lens Hood -->
    <rect x="136" y="94" width="46" height="28" rx="4" fill="#FFFFFF" stroke-width="3" />
    <ellipse cx="182" cy="108" rx="4" ry="14" fill="#EDEDED" stroke-width="2.5" />
    <!-- Front Glass Lens Reflection -->
    <path d="M 179 98 Q 181 108 179 118" stroke-width="1.5" />

    <!-- Barrel Brass Bands -->
    <line x1="146" y1="94" x2="146" y2="122" stroke-width="2" />
    <line x1="150" y1="94" x2="150" y2="122" stroke-width="1.2" />

    <!-- Main Barrel Body -->
    <rect x="42" y="97" width="94" height="22" rx="2" fill="#FFFFFF" stroke-width="2.8" />
    <!-- Main Barrel Hatching (Engraved Metal Sheen) -->
    <line x1="56" y1="102" x2="124" y2="102" stroke-width="1.2" stroke-dasharray="8 4" />
    <line x1="56" y1="105" x2="128" y2="105" stroke-width="1.8" />
    <line x1="56" y1="114" x2="126" y2="114" stroke-width="1.2" />

    <!-- Focus Drawtube (Narrower section near eyepiece) -->
    <rect x="18" y="100" width="24" height="16" fill="#EDEDED" stroke-width="2.2" />
    <!-- Focus Knobs -->
    <circle cx="34" cy="94" r="5" fill="#0A0A0A" stroke-width="1.8" />
    <circle cx="34" cy="122" r="5" fill="#0A0A0A" stroke-width="1.8" />
    <line x1="34" y1="94" x2="34" y2="122" stroke-width="2" />

    <!-- 90-degree Star Diagonal & Eyepiece -->
    <path d="M 18 100 L 8 100 L 2 110 L 2 124 L 14 124 L 18 116 Z" fill="#0A0A0A" stroke-width="2" />
    <rect x="0" y="124" width="16" height="12" rx="2" fill="#FFFFFF" stroke-width="2" />
    <ellipse cx="8" cy="136" rx="8" ry="3" fill="#EDEDED" stroke-width="2" />

    <!-- Finderscope (Small mounted scope on top of main barrel) -->
    <!-- Mounting Brackets -->
    <line x1="72" y1="97" x2="72" y2="82" stroke-width="2" />
    <line x1="112" y1="97" x2="112" y2="82" stroke-width="2" />
    <!-- Finder Tube -->
    <rect x="62" y="74" width="58" height="8" rx="2" fill="#FFFFFF" stroke-width="2" />
    <rect x="114" y="73" width="10" height="10" rx="1" fill="#EDEDED" stroke-width="1.8" />
    <rect x="54" y="75" width="8" height="6" fill="#0A0A0A" stroke-width="1.5" />
  </g>

  <!-- Celestial Coordinate Rings Floating near Eyepiece -->
  <ellipse cx="62" cy="74" rx="14" ry="6" stroke-width="1.2" stroke-dasharray="2 3" transform="rotate(-15 62 74)" />
</svg>
