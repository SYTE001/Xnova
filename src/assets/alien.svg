<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" fill="none" stroke="#0A0A0A" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Antenna with Orb -->
