<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none" stroke="#0A0A0A" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Moon Base Silhouette -->
  <circle cx="100" cy="100" r="82" fill="#FFFFFF" stroke-width="3.5" />

  <!-- Shadow Terminator Arc (Engraved Crescent Shadow) -->
