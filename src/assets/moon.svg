  <!-- Hatching along Terminator Shadow Edge -->
  <g stroke-width="1.5">
    <line x1="96" y1="28" x2="108" y2="34" />
    <line x1="104" y1="40" x2="118" y2="46" />
    <line x1="112" y1="52" x2="124" y2="58" />
    <line x1="118" y1="66" x2="132" y2="72" />
    <line x1="122" y1="80" x2="136" y2="86" />
    <line x1="124" y1="94" x2="138" y2="98" />
    <line x1="123" y1="108" x2="137" y2="112" />
    <line x1="119" y1="122" x2="133" y2="126" />
    <line x1="113" y1="136" x2="126" y2="140" />
    <line x1="105" y1="150" x2="117" y2="154" />
    <line x1="95" y1="164" x2="107" y2="168" />
  </g>

  <!-- Large Crater 1 (Upper Left) -->
  <ellipse cx="64" cy="62" rx="20" ry="16" fill="#EDEDED" stroke-width="2.5" />
  <ellipse cx="66" cy="63" rx="14" ry="11" fill="#FFFFFF" stroke-width="1.8" />
  <!-- Crater Interior Shadow -->
  <path d="M 52 62 C 54 54, 76 54, 78 62 C 76 68, 54 68, 52 62 Z" fill="#0A0A0A" />
  <line x1="56" y1="65" x2="62" y2="70" stroke-width="1.2" />
  <line x1="62" y1="66" x2="68" y2="71" stroke-width="1.2" />
  <line x1="68" y1="66" x2="74" y2="70" stroke-width="1.2" />

  <!-- Large Crater 2 (Lower Left) -->
  <ellipse cx="78" cy="128" rx="26" ry="20" fill="#EDEDED" stroke-width="2.5" />
  <ellipse cx="80" cy="130" rx="18" ry="14" fill="#FFFFFF" stroke-width="1.8" />
  <!-- Crater Interior Shadow -->
  <path d="M 64 128 C 66 118, 92 118, 96 128 C 92 136, 68 136, 64 128 Z" fill="#0A0A0A" />
  <line x1="70" y1="132" x2="78" y2="138" stroke-width="1.4" />
  <line x1="78" y1="134" x2="86" y2="140" stroke-width="1.4" />
  <line x1="86" y1="133" x2="92" y2="138" stroke-width="1.4" />

  <!-- Crater 3 (Mid-Center) -->
  <ellipse cx="106" cy="92" rx="14" ry="11" fill="#EDEDED" stroke-width="2" />
  <ellipse cx="107" cy="93" rx="9" ry="7" fill="#FFFFFF" stroke-width="1.4" />
  <path d="M 99 92 C 101 86, 113 86, 115 92 C 113 96, 101 96, 99 92 Z" fill="#0A0A0A" />

  <!-- Small Craters -->
  <circle cx="42" cy="100" r="8" fill="#EDEDED" stroke-width="1.8" />
  <path d="M 37 98 C 39 94, 45 94, 47 98 Z" fill="#0A0A0A" />

  <circle cx="94" cy="40" r="7" fill="#EDEDED" stroke-width="1.8" />
  <circle cx="56" cy="160" r="6" fill="#EDEDED" stroke-width="1.6" />
  <circle cx="118" cy="154" r="9" fill="#EDEDED" stroke-width="1.8" />
  <path d="M 112 152 C 114 148, 122 148, 124 152 Z" fill="#0A0A0A" />

  <!-- Lunar Ray Streaks (Ejecta Lines) -->
  <g stroke-width="1" stroke-dasharray="2 3">
    <line x1="64" y1="46" x2="60" y2="28" />
    <line x1="44" y1="62" x2="28" y2="60" />
    <line x1="84" y1="62" x2="98" y2="64" />
    <line x1="78" y1="148" x2="74" y2="166" />
    <line x1="104" y1="130" x2="120" y2="136" />
  </g>

  <!-- Stipple Texture Dots -->
  <g fill="#0A0A0A" stroke="none">
    <circle cx="50" cy="78" r="1.1" />
    <circle cx="54" cy="82" r="1" />
    <circle cx="46" cy="86" r="1.2" />
    <circle cx="86" cy="80" r="1.1" />
    <circle cx="92" cy="74" r="1" />
    <circle cx="70" cy="106" r="1.2" />
    <circle cx="76" cy="108" r="1" />
    <circle cx="82" cy="104" r="1.1" />
