<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260" fill="none" stroke="#0A0A0A" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Downward Tractor Beam Cone -->
  <g class="tractor-beam">
    <!-- Beam Area (subtle background) -->
    <polygon points="120,86 40,250 200,250" fill="#EDEDED" stroke="none" opacity="0.6" />
    <!-- Radiating Beam Hatch Lines -->
    <line x1="120" y1="88" x2="44" y2="250" stroke-width="1.8" stroke-dasharray="8 6" />
    <line x1="120" y1="88" x2="72" y2="250" stroke-width="1.5" stroke-dasharray="6 5" />
    <line x1="120" y1="88" x2="100" y2="250" stroke-width="1.2" stroke-dasharray="4 4" />
    <line x1="120" y1="88" x2="120" y2="250" stroke-width="1.5" stroke-dasharray="8 6" />
    <line x1="120" y1="88" x2="140" y2="250" stroke-width="1.2" stroke-dasharray="4 4" />
    <line x1="120" y1="88" x2="168" y2="250" stroke-width="1.5" stroke-dasharray="6 5" />
    <line x1="120" y1="88" x2="196" y2="250" stroke-width="1.8" stroke-dasharray="8 6" />

    <!-- Stippled Energy Particles along Beam -->
    <g fill="#0A0A0A" stroke="none">
      <circle cx="120" cy="115" r="1.5" />
      <circle cx="108" cy="138" r="1.2" />
      <circle cx="132" cy="142" r="1.4" />
      <circle cx="95" cy="172" r="1.6" />
      <circle cx="145" cy="168" r="1.3" />
      <circle cx="118" cy="188" r="1.5" />
      <circle cx="75" cy="215" r="1.4" />
      <circle cx="162" cy="218" r="1.6" />
      <circle cx="125" cy="226" r="1.3" />
      <circle cx="92" cy="242" r="1.5" />
      <circle cx="150" cy="240" r="1.4" />
    </g>
  </g>

  <!-- Flying Saucer Hull -->
  <!-- Underside Propulsion Ring -->
  <ellipse cx="120" cy="84" rx="42" ry="12" fill="#0A0A0A" stroke-width="2.5" />
  <ellipse cx="120" cy="86" rx="20" ry="6" fill="#FFFFFF" stroke-width="2" />
  <ellipse cx="120" cy="87" rx="10" ry="3" fill="#0A0A0A" stroke-width="1.5" />

  <!-- Main Saucer Disc Body -->
  <path d="M 28 66 C 28 50, 212 50, 212 66 C 212 82, 28 82, 28 66 Z" fill="#FFFFFF" stroke-width="3.5" />

  <!-- Saucer Rim Edge Plate -->
  <path d="M 28 66 C 28 78, 212 78, 212 66 L 212 72 C 212 84, 28 84, 28 72 Z" fill="#EDEDED" stroke-width="2" />

  <!-- Portholes / Lights along Rim -->
  <ellipse cx="48" cy="67" rx="5" ry="3" fill="#0A0A0A" stroke-width="1.5" />
  <ellipse cx="76" cy="71" rx="6" ry="3.5" fill="#0A0A0A" stroke-width="1.5" />
  <ellipse cx="106" cy="73" rx="7" ry="4" fill="#0A0A0A" stroke-width="1.5" />
  <ellipse cx="134" cy="73" rx="7" ry="4" fill="#0A0A0A" stroke-width="1.5" />
  <ellipse cx="164" cy="71" rx="6" ry="3.5" fill="#0A0A0A" stroke-width="1.5" />
  <ellipse cx="192" cy="67" rx="5" ry="3" fill="#0A0A0A" stroke-width="1.5" />

  <!-- Disc Top Engraved Hatching Panels -->
  <g stroke-width="1.2">
    <line x1="55" y1="58" x2="65" y2="65" />
    <line x1="62" y1="56" x2="72" y2="66" />
    <line x1="70" y1="55" x2="80" y2="67" />
    <line x1="170" y1="67" x2="180" y2="55" />
    <line x1="178" y1="66" x2="188" y2="56" />
    <line x1="185" y1="65" x2="195" y2="58" />
  </g>

  <!-- Cockpit Glass Dome -->
  <path d="M 72 55 C 72 24, 168 24, 168 55 Z" fill="#FFFFFF" stroke-width="3" />
  <!-- Dome Frame Band -->
  <path d="M 72 55 C 86 52, 154 52, 168 55" stroke-width="2.5" />

  <!-- Pilot Silhouette Inside Dome -->
  <ellipse cx="120" cy="38" rx="8" ry="7" fill="#0A0A0A" stroke="none" />
  <path d="M 112 50 C 112 44, 128 44, 128 50 Z" fill="#0A0A0A" stroke="none" />

  <!-- Curved Visor Reflection Arc -->
  <path d="M 86 42 Q 120 30 152 40" stroke-width="2" />
  <path d="M 92 46 Q 120 35 146 44" stroke-width="1.2" />

  <!-- Antenna on Top -->
  <line x1="120" y1="26" x2="120" y2="12" stroke-width="2.5" />
  <circle cx="120" cy="10" r="4.5" fill="#0A0A0A" stroke-width="2" />
  <!-- Antenna Radio Sparkles -->
  <path d="M 110 8 Q 114 10 110 12" stroke-width="1.5" />
  <path d="M 130 8 Q 126 10 130 12" stroke-width="1.5" />
</svg>
