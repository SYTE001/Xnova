<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="280" height="200" fill="none" stroke="#0A0A0A" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <defs>
    <!-- Mask to hide back of ring behind planet -->
    <clipPath id="planet-front-clip">
      <path d="M 0 0 L 280 0 L 280 200 L 0 200 Z" />
    </clipPath>
  </defs>

  <!-- Back of Planetary Rings (drawn behind planet) -->
  <g opacity="0.95">
    <ellipse cx="140" cy="100" rx="125" ry="38" transform="rotate(-18 140 100)" stroke-width="2.5" />
    <ellipse cx="140" cy="100" rx="116" ry="35" transform="rotate(-18 140 100)" stroke-width="1.2" stroke-dasharray="3 3" />
    <ellipse cx="140" cy="100" rx="104" ry="31" transform="rotate(-18 140 100)" stroke-width="2" />
    <ellipse cx="140" cy="100" rx="92" ry="27" transform="rotate(-18 140 100)" stroke-width="1" />
    <ellipse cx="140" cy="100" rx="84" ry="25" transform="rotate(-18 140 100)" stroke-width="2" />
  </g>

  <!-- Planet Body -->
  <circle cx="140" cy="100" r="54" fill="#FFFFFF" stroke-width="3" />

  <!-- Shadow & Hatching on Lower-Right Hemisphere (Vintage Engraved Bands) -->
  <g stroke-width="1.5">
    <!-- Atmospheric Latitude Stripes -->
    <path d="M 94 80 Q 140 92 186 80" stroke-width="2" />
    <path d="M 90 92 Q 140 106 190 92" stroke-width="2.2" />
    <path d="M 89 104 Q 140 120 191 104" stroke-width="2.5" />
    <path d="M 92 116 Q 140 134 188 116" stroke-width="2" />
    <path d="M 98 128 Q 140 146 182 128" stroke-width="1.8" />
    <path d="M 108 140 Q 140 154 172 140" stroke-width="1.5" />

    <!-- Fine Hatch Lines on Lower Shadow Hemisphere -->
    <path d="M 120 132 L 126 142" />
    <path d="M 128 131 L 135 143" />
    <path d="M 136 130 L 144 144" />
    <path d="M 144 128 L 153 143" />
    <path d="M 152 126 L 161 140" />
    <path d="M 160 122 L 168 134" />
    <path d="M 168 116 L 174 126" />

    <path d="M 130 145 L 138 152" />
    <path d="M 138 145 L 147 153" />
    <path d="M 146 144 L 154 151" />
  </g>

  <!-- Stipples on Shadow Edge -->
  <g fill="#0A0A0A" stroke="none">
    <circle cx="122" cy="122" r="1.1" />
    <circle cx="130" cy="123" r="1.2" />
    <circle cx="138" cy="120" r="1.3" />
    <circle cx="146" cy="118" r="1.2" />
    <circle cx="154" cy="114" r="1.1" />
    <circle cx="162" cy="108" r="1.2" />
    <circle cx="170" cy="102" r="1.1" />
    <circle cx="178" cy="94" r="1" />

    <circle cx="115" cy="138" r="1.2" />
    <circle cx="125" cy="148" r="1.1" />
    <circle cx="135" cy="151" r="1.3" />
    <circle cx="145" cy="151" r="1.2" />
  </g>

  <!-- Front Arc of Planetary Rings (cuts across front of planet with white border) -->
  <g transform="rotate(-18 140 100)">
    <!-- White backing to cleanly obscure planet body under the ring -->
    <path d="M 15 100 C 15 125, 265 125, 265 100 C 245 118, 35 118, 15 100 Z" fill="#FFFFFF" stroke="none" />

    <!-- Outer Ring Front Edge -->
    <path d="M 15 100 C 15 130, 265 130, 265 100" stroke="#0A0A0A" stroke-width="3" />
    <!-- Fine Ring Striations Front -->
    <path d="M 24 100 C 24 127, 256 127, 256 100" stroke="#0A0A0A" stroke-width="1.2" stroke-dasharray="4 2" />
    <!-- Cassini Division Gap -->
    <path d="M 36 100 C 36 123, 244 123, 244 100" stroke="#0A0A0A" stroke-width="2" />
    <path d="M 48 100 C 48 119, 232 119, 232 100" stroke="#0A0A0A" stroke-width="1.2" />
    <!-- Inner Ring Edge -->
    <path d="M 56 100 C 56 117, 224 117, 224 100" stroke="#0A0A0A" stroke-width="2.5" />

    <!-- Ring Engraving Hatch Lines (Left Wing) -->
    <line x1="28" y1="104" x2="33" y2="108" stroke="#0A0A0A" stroke-width="1.5" />
    <line x1="38" y1="108" x2="44" y2="113" stroke="#0A0A0A" stroke-width="1.5" />
    <line x1="50" y1="112" x2="57" y2="117" stroke="#0A0A0A" stroke-width="1.5" />
    <line x1="64" y1="115" x2="72" y2="120" stroke="#0A0A0A" stroke-width="1.5" />

    <!-- Ring Engraving Hatch Lines (Right Wing) -->
    <line x1="252" y1="104" x2="247" y2="108" stroke="#0A0A0A" stroke-width="1.5" />
    <line x1="242" y1="108" x2="236" y2="113" stroke="#0A0A0A" stroke-width="1.5" />
    <line x1="230" y1="112" x2="223" y2="117" stroke="#0A0A0A" stroke-width="1.5" />
    <line x1="216" y1="115" x2="208" y2="120" stroke="#0A0A0A" stroke-width="1.5" />
  </g>

  <!-- Tiny Orbiting Moonlet -->
  <circle cx="36" cy="48" r="6" fill="#FFFFFF" stroke-width="2" />
  <path d="M 33 46 C 36 49, 39 49, 41 47" stroke-width="1.2" />
  <circle cx="38" cy="51" r="0.8" fill="#0A0A0A" stroke="none" />
</svg>
